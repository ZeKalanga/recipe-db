name: 🔄 Update gkc-recipe-db Submodule

on:
  push:
    branches: [main]

jobs:
  update-server:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Server and Update gkc-recipe-db Submodule
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 18.199.163.68 >> ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=no ubuntu@18.199.163.68 << 'EOF'
            set -euo pipefail
            cd /var/www/gkc-recipe-db

            echo "🔄 Updating gkc-recipe-db submodule to latest..."
            cd data
            git fetch origin main
            git reset --hard origin/main
            cd ..

            echo "♻️ Restarting related PM2 processes..."
            pm2 restart gkc-recipe-db || true
            pm2 restart gkc-cooking-host || true
            pm2 save

            echo "✅ gkc-recipe-db submodule updated successfully."
          EOF
